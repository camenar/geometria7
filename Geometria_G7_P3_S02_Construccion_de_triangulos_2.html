<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometría 7° · Semana 2 · Construcción de triángulos · I.E. Merceditas Gómez Martínez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F2040;--blue:#1C3A6E;--blue-mid:#2E75B6;
  --green:#2E7D32;--teal:#00695C;--teal-soft:#E0F2F1;
  --amber:#C47C1A;--red:#B83232;--purple:#6A1B9A;
  --cream:#F7F6F2;--warm:#EDECEA;--border:#C0BDB4;
  --text:#1C1C1E;--text2:#3A3A3C;--text3:#4A4A4E;--sky:#A8C4E8;
  --green-s:#27AE60;--amber-s:#E08C20;--red-s:#C0392B;
  --s1:#2E7D32;--s2:#2E75B6;--s3:#00695C;--s4:#B83232;
  --fs-xs:clamp(13px,1.2vw,19px);--fs-sm:clamp(15px,1.5vw,22px);
  --fs-md:clamp(18px,1.8vw,27px);--fs-lg:clamp(22px,2.3vw,33px);
  --fs-xl:clamp(27px,2.9vw,42px);--fs-2xl:clamp(36px,4.1vw,58px);
  --fs-3xl:clamp(52px,6.5vw,94px);--fs-hero:clamp(64px,9vw,130px);
  --pad-h:clamp(18px,2.6vw,46px);--pad-v:clamp(12px,1.6vh,24px);
  --gap:clamp(9px,1.2vh,16px);--hdr-h:clamp(42px,5vh,58px);
  --ftr-h:clamp(32px,3.6vh,46px);--pan-w:clamp(140px,12vw,210px);
  --accent-w:clamp(7px,.6vw,12px);--radius:clamp(8px,.8vw,14px);
  --dot-sz:clamp(30px,3vw,42px);--sb:clamp(230px,24vw,360px);
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media(max-width:900px){
  .hac-grid,.meta-layout,.obj-grid{grid-template-columns:1fr!important}
  .lam-body{flex-direction:column!important}.sidebar{width:100%!important;border-right:none!important;border-bottom:2.5px solid var(--border)!important}
}
html,body{width:100%;height:100%;overflow:hidden;background:#0a101e;font-family:'DM Sans',system-ui,sans-serif;line-height:1.5}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#deck{width:100vw;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;background:var(--cream)}
.slide.active{opacity:1;pointer-events:all}
.slide.enter-r{animation:inR .35s cubic-bezier(.22,.68,0,1.15) forwards}
.slide.enter-l{animation:inL .35s cubic-bezier(.22,.68,0,1.15) forwards}
@keyframes inR{from{transform:translateX(4%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-4%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ── HEADER / FOOTER ── */
.hdr{background:var(--navy);height:var(--hdr-h);display:flex;align-items:center;padding:0 var(--pad-h);justify-content:space-between;flex-shrink:0;gap:14px}
.hdr-b{font-size:var(--fs-sm);color:var(--sky);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-b b{color:#fff;font-weight:700}
.hdr-t{color:#fff;font-size:var(--fs-xs);font-weight:800;padding:5px 15px;border-radius:6px;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0}
.ftr{background:var(--navy);height:var(--ftr-h);display:flex;align-items:center;padding:0 var(--pad-h);justify-content:space-between;flex-shrink:0;gap:14px}
.ftr span{font-size:var(--fs-xs);color:var(--sky);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow-y:auto;min-height:0;padding:var(--pad-v) var(--pad-h);display:flex;flex-direction:column;gap:var(--gap)}

/* ── PORTADA ── */
.s-portada{background:var(--navy);align-items:center;justify-content:center}
.p-inner{display:flex;flex-direction:column;align-items:center;gap:var(--gap);text-align:center;padding:var(--pad-v) var(--pad-h);width:100%}
.p-badge{font-size:var(--fs-sm);letter-spacing:.1em;text-transform:uppercase;color:var(--sky);font-weight:600}
.p-title{font-family:'DM Serif Display',serif;font-size:var(--fs-3xl);color:#fff;line-height:1.05;animation:fadeUp .8s .1s both}
.p-title em{font-style:normal}
.p-sub{font-size:var(--fs-md);color:var(--sky);animation:fadeUp .8s .3s both}
.p-sessions{display:flex;gap:var(--gap);margin-top:4px;animation:fadeUp .8s .5s both;justify-content:center;flex-wrap:wrap}
.psess{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:var(--radius);padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:140px;max-width:210px}
.psess.on{background:rgba(46,117,182,.28);border-color:#8EB8E5}
.psess-n{width:var(--dot-sz);height:var(--dot-sz);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:var(--fs-md)}
.psess-t{font-size:var(--fs-sm);font-weight:700;color:#fff;text-align:center;line-height:1.25}
.psess-s{font-size:var(--fs-xs);color:var(--sky);font-style:italic;text-align:center}
.click-hint{font-size:var(--fs-xs);color:rgba(168,196,232,.6);animation:pulse 2s infinite;margin-top:4px}

/* ── PORTADA DE SESIÓN (ancho completo) ── */
.cov{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(12px,1.8vh,26px);justify-content:center}
.cov-top{display:flex;align-items:center;gap:clamp(14px,2vw,30px)}
.cov-num{width:clamp(72px,8vw,124px);height:clamp(72px,8vw,124px);border-radius:clamp(14px,1.6vw,24px);
  background:var(--s2);color:#fff;font-family:'DM Serif Display',serif;font-size:var(--fs-2xl);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 18px rgba(46,117,182,.28)}
.cov-kicker{font-size:var(--fs-xs);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--s2)}
.cov-title{font-family:'DM Serif Display',serif;font-size:var(--fs-2xl);color:var(--navy);line-height:1.05;margin-top:2px}
.cov-sub{font-size:var(--fs-md);color:var(--text2);letter-spacing:.06em;font-weight:600}
.sess-ruta{font-size:var(--fs-sm);color:var(--text2);font-style:italic;text-align:center}
.divider{height:2px;background:var(--border);border-radius:2px;flex-shrink:0}
.obj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.obj-card{background:#fff;border:2px solid var(--border);border-top:5px solid var(--s2);border-radius:var(--radius);padding:clamp(10px,1.4vh,18px) clamp(12px,1.2vw,20px);display:flex;flex-direction:column;gap:8px}
.obj-n{width:var(--dot-sz);height:var(--dot-sz);border-radius:50%;background:var(--s2);color:#fff;font-weight:800;font-size:var(--fs-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.obj-tx{font-size:var(--fs-sm);color:var(--text);line-height:1.35}
.tiempo{background:var(--navy);border-radius:var(--radius);padding:clamp(9px,1.2vh,15px) var(--pad-h);font-size:var(--fs-sm);font-weight:600;color:#fff;text-align:center;flex-shrink:0}

/* ── TÍTULOS ── */
.title-row{display:flex;align-items:flex-start;gap:var(--gap);flex-shrink:0}
.accent{width:var(--accent-w);border-radius:5px;flex-shrink:0;align-self:stretch;min-height:40px}
.mbadge{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:var(--fs-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 15px;border-radius:6px;margin-bottom:4px}
.slide-title{font-family:'DM Serif Display',serif;font-size:var(--fs-xl);color:var(--navy);line-height:1.1}
.slide-instr{font-size:var(--fs-sm);color:var(--text2);font-style:italic;margin-top:3px;line-height:1.4}

/* ══ LÁMINA DE CONSTRUCCIÓN ══ */
.s-lamina .body{padding:0;gap:0;overflow:hidden}
.lam-body{flex:1;min-height:0;display:flex;flex-direction:row}
.sidebar{width:var(--sb);flex-shrink:0;display:flex;flex-direction:column;
  padding:clamp(12px,1.6vh,22px) clamp(12px,1.5vw,22px);gap:clamp(9px,1.2vh,16px);
  border-right:2.5px solid var(--border);background:var(--warm);overflow-y:auto}
.stitle{font-family:'DM Serif Display',serif;font-size:var(--fs-lg);color:var(--navy);line-height:1.08}
.ssubt{font-size:var(--fs-xs);color:var(--text2);font-style:italic;margin-top:3px}
.sdiv{height:2px;background:var(--border);border-radius:2px;flex-shrink:0}
.datos{display:flex;gap:6px;flex-wrap:wrap}
.datos b{font-size:var(--fs-xs);font-weight:800;color:#fff;padding:4px 12px;border-radius:20px;letter-spacing:.02em}
.steps{display:flex;flex-direction:column;gap:clamp(6px,.9vh,11px);flex:1}
.cstep{display:flex;align-items:center;gap:clamp(8px,.9vw,13px);background:#fff;border:2px solid var(--border);
  border-radius:10px;border-left:5px solid var(--teal);padding:clamp(7px,.9vh,12px) clamp(9px,1.1vw,16px);
  opacity:.3;transform:translateX(-3px);transition:opacity .4s,transform .4s,box-shadow .3s}
.cstep.vis{opacity:1;transform:none;box-shadow:0 3px 10px rgba(20,30,60,.08)}
.cstep .n{width:clamp(26px,2.6vw,36px);height:clamp(26px,2.6vw,36px);border-radius:50%;background:var(--teal);
  color:#fff;font-weight:800;font-size:var(--fs-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cstep .t{font-size:var(--fs-xs);font-weight:700;color:var(--navy);line-height:1.2}
.cstep.k1{border-left-color:var(--blue)} .cstep.k1 .n{background:var(--blue)}
.cstep.k2{border-left-color:var(--teal)} .cstep.k2 .n{background:var(--teal)}
.cstep.k3{border-left-color:var(--amber)} .cstep.k3 .n{background:var(--amber)}
.cstep.k4{border-left-color:var(--purple)} .cstep.k4 .n{background:var(--purple)}
.cstep.k5{border-left-color:var(--red)} .cstep.k5 .n{background:var(--red)}
.mats{background:var(--teal-soft);border:2px solid var(--teal);border-radius:10px;padding:clamp(8px,1vh,13px) clamp(10px,1.1vw,15px);flex-shrink:0}
.mats .lbl{font-size:var(--fs-xs);font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
.mats .note{font-size:var(--fs-xs);color:var(--text2);line-height:1.35}
.figpanel{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:clamp(6px,.8vw,14px);background:var(--cream)}
.figpanel svg{width:100%;height:100%}

.rev{opacity:0;transition:opacity .45s ease}
.rev.vis{opacity:1}
.esc{opacity:0;transform:translate(var(--dx,0),var(--dy,100px));
  transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s ease-out}
.esc.vis{opacity:1;transform:translate(0,0)}
.esc-t{--c-main:#00695C;--c-bg:rgba(0,105,92,.12);--c-edge:#004D40;--dx:-180px;--dy:230px}
.esc-a{--c-main:#C47C1A;--c-bg:rgba(196,124,26,.12);--c-edge:#9A6010;--dx:280px;--dy:-180px}
.esc-p{--c-main:#6A1B9A;--c-bg:rgba(106,27,154,.12);--c-edge:#4A148C;--dx:-280px;--dy:-260px}
.esc-b{--c-main:#1C3A6E;--c-bg:rgba(28,58,110,.12);--c-edge:#0F2040;--dx:220px;--dy:250px}
.tool .bg{fill:var(--c-bg);stroke:var(--c-main)}
.tool .edge{stroke:var(--c-edge)}
.tool .sym{stroke:var(--c-main)}
.tool .leg{stroke:var(--c-main);stroke-linecap:round}
.tool .knob{fill:var(--c-edge)}
.tool .tip{fill:var(--c-edge)}
.draw{stroke-dasharray:var(--len,550);stroke-dashoffset:var(--len,550)}
.vis .draw{animation:drawIt 1s ease-out .7s forwards}
@keyframes drawIt{to{stroke-dashoffset:0}}
.late{opacity:0}
.vis .late{animation:fadeInLate .4s ease forwards 1.4s}
@keyframes fadeInLate{to{opacity:1}}

/* ── DETONANTE ── */
.s-gancho .body{padding:0;gap:0}

/* ── TARJETAS ── */
.hac-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);flex:1;min-height:0;align-content:start}
.hac-card{background:#fff;border-radius:var(--radius);border:2px solid var(--border);border-top:5px solid transparent;padding:clamp(11px,1.4vh,19px) clamp(13px,1.3vw,22px);display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s}
.hac-card.vis{opacity:1;transform:none}
.hac-head{display:flex;align-items:center;gap:10px}
.hac-n{width:var(--dot-sz);height:var(--dot-sz);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-sm);color:#fff;flex-shrink:0}
.hac-tag{padding:5px 14px;border-radius:8px;color:#fff;font-weight:800;font-size:var(--fs-sm);letter-spacing:.14em;flex-shrink:0}
.hac-title{font-size:var(--fs-md);font-weight:700;color:var(--text);line-height:1.2}
.hac-ctx{font-size:var(--fs-sm);color:var(--text2);font-style:italic;line-height:1.4}
.hac-task{background:var(--warm);border-radius:6px;padding:7px 12px;font-size:var(--fs-sm);color:var(--navy);font-style:italic;font-weight:600;border-left:4px solid var(--blue-mid);line-height:1.35}
.hac-answer{border-radius:6px;padding:8px 12px;font-size:var(--fs-sm);font-weight:600;opacity:0;transition:opacity .4s;line-height:1.4}

/* ── TRANSICIÓN ── */
.s-trans{background:var(--navy);align-items:center;justify-content:center}
.trans-big{font-family:'DM Serif Display',serif;font-size:var(--fs-3xl);color:#fff;line-height:1;animation:fadeUp .6s both}
.trans-sub{font-size:var(--fs-lg);color:var(--sky);animation:fadeUp .6s .2s both}
.trans-note{font-size:var(--fs-sm);color:rgba(168,196,232,.7);font-style:italic;animation:fadeUp .6s .4s both}

/* ── METACOGNICIÓN ── */
.meta-layout{display:grid;grid-template-columns:1.05fr 1fr;gap:var(--gap);flex:1;min-height:0;align-content:start}
.meta-l,.meta-r{display:flex;flex-direction:column;gap:var(--gap)}
.meta-qbox{background:var(--teal-soft);border:2.5px solid var(--teal);border-radius:var(--radius);padding:clamp(11px,1.4vh,19px) clamp(13px,1.3vw,22px);display:flex;flex-direction:column;gap:6px}
.meta-qlbl{font-size:var(--fs-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.meta-qtxt{font-family:'DM Serif Display',serif;font-size:var(--fs-md);color:var(--text);font-style:italic;line-height:1.45}
.cuad-t,.sema-t{font-size:var(--fs-sm);font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.1em}
.cuad-items,.sema-items{display:flex;flex-direction:column;gap:clamp(7px,1vh,13px)}
.cuad-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:clamp(8px,1.1vh,15px) clamp(11px,1.2vw,18px);border-left:5px solid var(--teal);font-size:var(--fs-sm);color:var(--text);line-height:1.35}
.cuad-n{font-weight:800;color:var(--teal);flex-shrink:0;min-width:20px}
.sema-item{display:flex;align-items:center;gap:13px;background:#fff;border-radius:var(--radius);padding:clamp(8px,1.1vh,15px) clamp(11px,1.2vw,18px);border:2px solid var(--border);opacity:0;transform:translateX(14px);transition:opacity .5s,transform .5s}
.sema-item.vis{opacity:1;transform:none}
.sema-c{width:clamp(34px,3.6vw,50px);height:clamp(34px,3.6vw,50px);border-radius:50%;flex-shrink:0;border:3px solid rgba(0,0,0,.1)}
.sema-txt{font-size:var(--fs-sm);color:var(--text);line-height:1.3}
.sema-txt strong{display:block;font-size:var(--fs-xs);color:var(--text3);margin-top:2px;font-weight:600}

/* ── NAV ── */
#nav{position:fixed;bottom:clamp(10px,1.8vh,20px);right:clamp(14px,1.8vw,28px);display:flex;align-items:center;gap:9px;z-index:100}
.nbtn{width:clamp(38px,3.8vw,50px);height:clamp(38px,3.8vw,50px);border-radius:50%;background:rgba(15,32,64,.88);border:1.5px solid rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:clamp(16px,1.8vw,22px);display:flex;align-items:center;justify-content:center;transition:background .2s}
.nbtn:hover{background:var(--blue-mid)}
#ncnt{font-size:clamp(13px,1.3vw,18px);color:rgba(255,255,255,.88);background:rgba(15,32,64,.75);padding:5px 15px;border-radius:20px;font-family:monospace;font-weight:600}
#pbar{position:fixed;bottom:0;left:0;height:5px;background:var(--s2);transition:width .35s ease;z-index:100}
#fs-btn{position:fixed;top:clamp(6px,.8vh,11px);right:clamp(50px,5.5vw,74px);z-index:200;background:rgba(15,32,64,.7);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;font-size:15px;width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center}
#fs-btn:hover{background:var(--blue-mid)}
#hint{position:fixed;bottom:clamp(10px,1.8vh,20px);left:clamp(14px,1.8vw,28px);font-size:12px;color:rgba(255,255,255,.5);background:rgba(15,32,64,.65);padding:5px 13px;border-radius:20px;font-family:monospace;transition:opacity .3s;z-index:100}
</style>
</head>
<body>
<div id="deck"></div>
<button id="fs-btn" title="Pantalla completa (F)" aria-label="Pantalla completa">⛶</button>
<div id="nav">
  <button class="nbtn" id="bp" aria-label="Anterior">&#8592;</button>
  <span id="ncnt">1 / 1</span>
  <button class="nbtn" id="bn" aria-label="Siguiente">&#8594;</button>
</div>
<div id="pbar"></div>
<div id="hint">Espacio / → avanzar &nbsp;·&nbsp; ← retroceder &nbsp;·&nbsp; F pantalla completa</div>

<!-- ═══ MOLDES DE HERRAMIENTAS (compartidos por todas las láminas) ═══ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="sombraPlana" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2040" flood-opacity="0.14"/>
  </filter>
  <!-- REGLA: borde de trazado en y=0 -->
  <g id="regla">
    <rect class="bg" x="0" y="0" width="470" height="34" rx="4" stroke-width="1.5"/>
    <line class="edge" x1="0" y1="0" x2="470" y2="0" stroke-width="4.5" stroke-linecap="round"/>
    <g opacity=".65">
      <line class="sym" x1="10" y1="4" x2="460" y2="4" stroke-width="8" stroke-dasharray="1 9"/>
      <line class="sym" x1="10" y1="6" x2="460" y2="6" stroke-width="12" stroke-dasharray="2 48"/>
    </g>
  </g>
  <!-- COMPÁS: aguja en (0,0), mina en (300,0), bisagra arriba -->
  <g id="compas">
    <line class="leg" x1="0" y1="0" x2="150" y2="-250" stroke-width="9"/>
    <line class="leg" x1="300" y1="0" x2="150" y2="-250" stroke-width="9"/>
    <line class="leg" x1="150" y1="-250" x2="150" y2="-300" stroke-width="7"/>
    <circle class="knob" cx="150" cy="-250" r="15"/>
    <circle class="knob" cx="150" cy="-306" r="11"/>
    <path class="tip" d="M -7 -22 L 7 -22 L 0 5 Z"/>
    <path class="tip" d="M 293 -22 L 307 -22 L 300 5 Z"/>
  </g>
  <!-- TRANSPORTADOR: centro en (0,0), borde recto en y=0 -->
  <g id="transp">
    <path class="bg" d="M -165 0 A 165 165 0 0 1 165 0 Z" stroke-width="1.5"/>
    <path class="sym" d="M -142 0 A 142 142 0 0 1 142 0" fill="none" stroke-width="15" stroke-dasharray="2.5 22" opacity=".55"/>

/* ═══════════ MOTOR ═══════════ */
let cur=0,clicks=0;
const deck=document.getElementById('deck');

/* Revelado de láminas: el paso 1 está visible al entrar; cada clic avanza un paso */
function lam(n){
  const sl=deck.querySelector('.slide.active');if(!sl)return;
  const step=n+1;
  sl.querySelectorAll('[data-step]').forEach(el=>{
    const s=parseInt(el.getAttribute('data-step'),10);
    if(el.hasAttribute('data-only'))el.classList.toggle('vis',s===step);
    else el.classList.toggle('vis',s<=step);
  });
}

function buildSlide(idx){
  const s=SLIDES[idx];
  const acc=s.accent?`var(${s.accent})`:'var(--blue-mid)';
  const d=document.createElement('div');
  d.className='slide'+(s.cls?' '+s.cls:'');
  let h='';
  if(!s.noH)h+=`<div class="hdr"><span class="hdr-b">${s.bread||''}</span>${s.time?`<span class="hdr-t" style="background:${acc}">${s.time}</span>`:''}</div>`;
  h+=`<div class="body">${s.html}</div>`;
  if(!s.noF)h+=`<div class="ftr"><span>${s.fL||''}</span><span>I.E. Merceditas Gómez Martínez · Geometría 7° · Período 3</span></div>`;
  d.innerHTML=h;return d;
}

function show(idx,dir){
  const prev=deck.querySelector('.slide.active');
  if(prev)prev.classList.remove('active','enter-r','enter-l');
  const el=buildSlide(idx);deck.appendChild(el);
  const all=deck.querySelectorAll('.slide');if(all.length>3)all[0].remove();
  requestAnimationFrame(()=>{
    el.classList.add('active');el.classList.add(dir>=0?'enter-r':'enter-l');
    setTimeout(()=>el.classList.remove('enter-r','enter-l'),380);
  });
  clicks=0;
  document.getElementById('ncnt').textContent=`${idx+1} / ${SLIDES.length}`;
  document.getElementById('pbar').style.width=(((idx+1)/SLIDES.length)*100)+'%';
  document.getElementById('pbar').style.background=SLIDES[idx].accent?`var(${SLIDES[idx].accent})`:'var(--s2)';
}

function advance(){
  const s=SLIDES[cur];
  if(clicks<(s.clicks||0)){clicks++;if(s.onReveal)s.onReveal(clicks);return;}
  if(cur<SLIDES.length-1){cur++;show(cur,1);}
}
function retreat(){if(cur>0){cur--;show(cur,-1);}}

const fsb=document.getElementById('fs-btn');
fsb.onclick=async e=>{e.stopPropagation();try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(err){}};
document.addEventListener('fullscreenchange',()=>{fsb.textContent=document.fullscreenElement?'✕':'⛶';});
document.addEventListener('keydown',e=>{
  if(['Space','ArrowRight','PageDown'].includes(e.code)){e.preventDefault();advance();}
  else if(['ArrowLeft','PageUp'].includes(e.code)){e.preventDefault();retreat();}
  else if(e.code==='KeyF'){fsb.click();}
});
document.addEventListener('click',e=>{
  if(e.target.closest('#nav')||e.target.closest('#fs-btn'))return;
  advance();
});
document.getElementById('bn').addEventListener('click',advance);
document.getElementById('bp').addEventListener('click',retreat);
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?advance():retreat();}});
setTimeout(()=>{document.getElementById('hint').style.opacity='0';},5000);
show(0,1);
</script>
