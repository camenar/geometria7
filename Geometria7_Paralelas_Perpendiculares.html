<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometría 7° · Rectas Paralelas y Perpendiculares · I.E. Merceditas Gómez Martínez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F2040;--blue:#1C3A6E;--blue-mid:#2E75B6;
  --green:#2E7D32;--teal:#00695C;--amber:#C47C1A;--red:#B71C1C;--purple:#6C3483;
  --cream:#F4F3EF;--warm:#EDECEA;--border:#C0BDB4;
  --text:#0A0A0B;--text2:#2A2A2C;--text3:#4A4A4E;
  --green-s:#27AE60;--amber-s:#E08C20;--red-s:#C0392B;
  --s1:#2E7D32;--sky:#A8C4E8;
  --fs-xs:clamp(14px,1.3vw,20px);--fs-sm:clamp(16px,1.6vw,24px);
  --fs-md:clamp(20px,2.0vw,30px);--fs-lg:clamp(24px,2.5vw,36px);
  --fs-xl:clamp(30px,3.2vw,46px);--fs-2xl:clamp(40px,4.5vw,64px);
  --fs-3xl:clamp(56px,7vw,100px);--fs-hero:clamp(70px,10vw,140px);
  --pad-h:clamp(20px,3vw,52px);--pad-v:clamp(14px,1.8vh,28px);
  --gap:clamp(10px,1.4vh,18px);--hdr-h:clamp(46px,5.5vh,64px);
  --ftr-h:clamp(36px,4vh,52px);
  --accent-w:clamp(8px,0.7vw,14px);--radius:clamp(8px,0.8vw,16px);
  --dot-sz:clamp(32px,3.2vw,46px);
  --sb:clamp(220px,25vw,360px);
}
@media(min-width:1800px){:root{--fs-xs:22px;--fs-sm:26px;--fs-md:32px;--fs-lg:40px;--fs-xl:50px;--fs-2xl:68px;--fs-3xl:110px;--fs-hero:150px;--pad-h:56px;--pad-v:30px;--gap:20px;--hdr-h:68px;--ftr-h:54px}}
@media(max-width:1200px){:root{--fs-xs:14px;--fs-sm:17px;--fs-md:21px;--fs-lg:26px;--fs-xl:32px;--fs-2xl:44px;--fs-3xl:64px;--fs-hero:88px;--pad-h:24px;--pad-v:12px;--gap:10px;--hdr-h:48px;--ftr-h:38px}}
@media(max-width:800px){.hac-grid,.meta-layout,.lam-body{grid-template-columns:1fr!important;}.lam-body{grid-template-rows:auto 1fr!important}}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'DM Sans',system-ui,sans-serif}
#deck{width:100vw;height:100vh;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;background:#fff}
.slide.active{opacity:1;pointer-events:all}
.slide.enter-r{animation:inR .35s cubic-bezier(.22,.68,0,1.15) forwards}
.slide.enter-l{animation:inL .35s cubic-bezier(.22,.68,0,1.15) forwards}
@keyframes inR{from{transform:translateX(4%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-4%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes drawL{to{stroke-dashoffset:0}}
@keyframes fadeIn2{to{opacity:1}}

.hdr{background:var(--navy);height:var(--hdr-h);display:flex;align-items:center;padding:0 var(--pad-h);justify-content:space-between;flex-shrink:0}
.hdr-b{font-size:var(--fs-sm);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#C8DDEF}
.hdr-t{color:#fff;font-size:var(--fs-sm);font-weight:800;padding:6px 18px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase}
.ftr{background:var(--warm);border-top:2px solid var(--border);height:var(--ftr-h);display:flex;align-items:center;padding:0 var(--pad-h);justify-content:space-between;flex-shrink:0}
.ftr span{font-size:var(--fs-sm);color:var(--text3);font-weight:600}
.body{flex:1;overflow-y:auto;min-height:0;padding:var(--pad-v) var(--pad-h);display:flex;flex-direction:column;gap:var(--gap)}

.s-portada{background:var(--navy);align-items:center;justify-content:center}
.p-inner{display:flex;flex-direction:column;align-items:center;gap:var(--gap);text-align:center;padding:var(--pad-v) var(--pad-h);width:100%}
.p-badge{font-size:var(--fs-md);letter-spacing:.1em;text-transform:uppercase;color:#C8DDEF;font-weight:600}
.p-title{font-family:'DM Serif Display',serif;font-size:var(--fs-hero);color:#fff;line-height:1.05;animation:fadeUp .8s .1s both}
.p-sub{font-size:var(--fs-lg);color:#C8DDEF;animation:fadeUp .8s .3s both}
.p-meta{display:flex;gap:var(--gap);margin-top:6px;animation:fadeUp .8s .5s both;justify-content:center;flex-wrap:wrap}
.p-meta-item{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:var(--radius);padding:14px 24px;display:flex;align-items:center;gap:10px}
.p-meta-item span{font-size:var(--fs-md);color:#C8DDEF;font-weight:600}
.click-hint-portada{font-size:var(--fs-sm);color:rgba(200,221,239,.6);animation:pulse 2s infinite;margin-top:6px}

.sess-title{font-family:'DM Serif Display',serif;font-size:var(--fs-2xl);color:var(--navy);line-height:1.1}
.divider{height:2px;background:var(--border);border-radius:1px;flex-shrink:0}
.obj-list{display:flex;flex-direction:column;gap:var(--gap)}
.obj-item{display:flex;align-items:flex-start;gap:14px;background:var(--cream);border-radius:var(--radius);padding:var(--pad-v) var(--pad-h);border-left:6px solid var(--blue-mid);font-size:var(--fs-lg);color:var(--text);line-height:1.35}
.obj-dot{width:var(--dot-sz);height:var(--dot-sz);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-md);font-weight:700;color:#fff;flex-shrink:0;margin-top:2px}
.tiempo{background:var(--navy);border-radius:var(--radius);padding:var(--pad-v) var(--pad-h);font-size:var(--fs-md);font-weight:600;color:#fff;text-align:center;flex-shrink:0}

.title-row{display:flex;align-items:flex-start;gap:var(--gap)}
.accent{width:var(--accent-w);border-radius:5px;flex-shrink:0;align-self:stretch;min-height:44px}
.mbadge{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;font-size:var(--fs-sm);font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 18px;border-radius:6px;margin-bottom:4px}
.slide-title{font-family:'DM Serif Display',serif;font-size:var(--fs-2xl);color:var(--navy);line-height:1.1}
.slide-instr{font-size:var(--fs-md);color:var(--text2);font-style:italic;margin-top:4px;line-height:1.4}

.det-box{background:#FFF7ED;border:3px solid var(--amber);border-radius:var(--radius);padding:var(--pad-v) var(--pad-h);display:flex;flex-direction:column;gap:var(--gap)}
.det-label{font-size:var(--fs-sm);font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--amber);flex-shrink:0}
.det-chips{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0}
.det-chip{color:#fff;font-size:var(--fs-md);font-weight:700;padding:7px 18px;border-radius:20px}

.hac-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);flex:1;min-height:0;align-content:start}
.hac-card{background:#fff;border-radius:var(--radius);border:2px solid var(--border);border-top:5px solid transparent;padding:var(--pad-v) var(--pad-h);display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s}
.hac-card.vis{opacity:1;transform:none}
.hac-head{display:flex;align-items:center;gap:10px}
.hac-n{width:var(--dot-sz);height:var(--dot-sz);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-md);color:#fff;flex-shrink:0}
.hac-title{font-size:var(--fs-lg);font-weight:700;color:var(--text)}
.hac-ctx{font-size:var(--fs-md);color:var(--text2);font-style:italic;line-height:1.4}
.hac-body{font-size:var(--fs-md);color:var(--text);line-height:1.5}
.hac-task{background:var(--cream);border-radius:6px;padding:8px 12px;font-size:var(--fs-md);color:var(--navy);font-style:italic;font-weight:600;border-left:4px solid var(--blue-mid)}

.rv{background:var(--cream);border:2px solid var(--border);border-left:6px solid var(--navy);border-radius:var(--radius);padding:var(--pad-v) var(--pad-h);display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(14px);transition:opacity .5s cubic-bezier(.22,.68,0,1.2),transform .5s cubic-bezier(.22,.68,0,1.2)}
.rv.vis{opacity:1;transform:none}
.rv-t{font-size:var(--fs-sm);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.rv-body{font-size:var(--fs-md);color:var(--text);line-height:1.5}
.rv-formula{background:#fff;border-radius:calc(var(--radius) - 2px);padding:clamp(8px,1.2vh,18px);text-align:center;border:2px solid var(--border);font-family:'DM Serif Display',serif;font-size:var(--fs-xl);color:var(--navy)}

.s-trans{background:var(--navy);align-items:center;justify-content:center}
.trans-big{font-family:'DM Serif Display',serif;font-size:var(--fs-3xl);color:#fff;line-height:1;animation:fadeUp .6s both}
.trans-sub{font-size:var(--fs-xl);color:#C8DDEF;animation:fadeUp .6s .2s both}
.trans-note{font-size:var(--fs-lg);color:rgba(200,221,239,.65);font-style:italic;animation:fadeUp .6s .4s both}

.meta-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--gap);flex:1;min-height:0;align-content:start}
.meta-l{display:flex;flex-direction:column;gap:var(--gap)}
.meta-qbox{background:#E0F2F1;border:3px solid var(--teal);border-radius:var(--radius);padding:var(--pad-v) var(--pad-h);display:flex;flex-direction:column;gap:8px}
.meta-qlbl{font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.meta-qtxt{font-family:'DM Serif Display',serif;font-size:var(--fs-lg);color:var(--text);font-style:italic;line-height:1.5}
.cuad-t{font-size:var(--fs-md);font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.1em}
.cuad-items{display:flex;flex-direction:column;gap:var(--gap)}
.cuad-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:var(--radius);padding:var(--pad-v) var(--pad-h);border-left:5px solid var(--teal);font-size:var(--fs-md);color:var(--text);line-height:1.4}
.cuad-n{font-weight:700;color:var(--teal);flex-shrink:0;min-width:24px;font-size:var(--fs-md)}
.meta-r{display:flex;flex-direction:column;gap:var(--gap)}
.sema-t{font-size:var(--fs-md);font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.1em}
.sema-items{display:flex;flex-direction:column;gap:var(--gap)}
.sema-item{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--radius);padding:var(--pad-v) var(--pad-h);border:2px solid var(--border);opacity:0;transform:translateX(14px);transition:opacity .5s,transform .5s}
.sema-item.vis{opacity:1;transform:none}
.sema-c{width:clamp(40px,4.5vw,62px);height:clamp(40px,4.5vw,62px);border-radius:50%;flex-shrink:0;border:3px solid rgba(0,0,0,.1)}
.sema-txt{font-size:var(--fs-md);color:var(--text);line-height:1.3}
.sema-txt strong{display:block;font-size:var(--fs-sm);color:var(--text3);margin-top:2px}

.svg-demo-row{display:flex;gap:var(--gap);flex:1;min-height:0;align-items:stretch}
.svg-card{background:#fff;border:2px solid var(--border);border-radius:var(--radius);padding:var(--pad-v) var(--pad-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:1;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.svg-card.vis{opacity:1;transform:none}
.svg-card svg{width:100%;max-height:clamp(120px,22vh,260px)}
.svg-card-lbl{font-family:'DM Serif Display',serif;font-size:var(--fs-lg);color:var(--text);text-align:center}
.svg-card-note{font-size:var(--fs-md);color:var(--text3);text-align:center;line-height:1.4}

/* ── LÁMINA (estilo baricentro) ── */
.lam-body{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:1fr;flex:1;min-height:0}
.lam-sb{display:flex;flex-direction:column;padding:var(--pad-v) var(--pad-h);gap:var(--gap);border-right:2.5px solid var(--border);background:var(--warm);overflow-y:auto}
.lam-title{font-family:'DM Serif Display',serif;font-size:clamp(20px,2.2vw,36px);color:var(--navy);line-height:1.08}
.lam-subt{font-size:var(--fs-sm);color:var(--text2);font-style:italic;margin-top:2px}
.lam-div{height:2px;background:var(--border);border-radius:2px;flex-shrink:0}
.lam-steps{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);flex:1}
.cstep{display:flex;align-items:center;gap:clamp(8px,1vw,14px);background:#fff;border:2px solid var(--border);border-radius:10px;border-left:5px solid var(--teal);padding:clamp(7px,1vh,13px) clamp(10px,1.2vw,18px);opacity:.3;transform:translateX(-3px);transition:opacity .4s,transform .4s,box-shadow .3s}
.cstep.vis{opacity:1;transform:none;box-shadow:0 3px 10px rgba(20,30,60,.08)}
.cstep .n{width:clamp(28px,2.8vw,38px);height:clamp(28px,2.8vw,38px);border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:var(--fs-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cstep .t{font-size:clamp(13px,1.3vw,20px);font-weight:700;color:var(--navy);line-height:1.15}
.cstep.c-blue{border-left-color:var(--blue)}.cstep.c-blue .n{background:var(--blue)}
.cstep.c-teal{border-left-color:var(--teal)}.cstep.c-teal .n{background:var(--teal)}
.cstep.c-amber{border-left-color:var(--amber)}.cstep.c-amber .n{background:var(--amber)}
.cstep.c-purple{border-left-color:var(--purple)}.cstep.c-purple .n{background:var(--purple)}
.cstep.c-red{border-left-color:var(--red)}.cstep.c-red .n{background:var(--red)}
.cstep.c-green{border-left-color:var(--green)}.cstep.c-green .n{background:var(--green)}
.lam-mats{background:#E0F2F1;border:2px solid var(--teal);border-radius:10px;padding:clamp(8px,1vh,14px) clamp(10px,1.2vw,16px);flex-shrink:0}
.lam-mats .lbl{font-size:clamp(11px,1vw,15px);font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.lam-mats .note{font-size:clamp(11px,1vw,15px);color:var(--text2);line-height:1.35}
.lam-fig{display:flex;align-items:center;justify-content:center;padding:clamp(6px,.8vw,14px);background:var(--cream)}
.lam-fig svg{width:100%;height:100%}

/* SVG reveal + draw */
.rev{opacity:0;transition:opacity .45s ease}.rev.vis{opacity:1}
.esc{opacity:0;transform:translate(var(--dx,0),var(--dy,100px));transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s ease-out}
.esc.vis{opacity:1;transform:translate(0,0)}
.draw-line{stroke-dasharray:550;stroke-dashoffset:550}
.vis .draw-line{animation:drawL 1s ease-out .7s forwards}
.delay-reveal{opacity:0}
.vis .delay-reveal{animation:fadeIn2 .4s ease forwards 1.4s}

#nav{position:fixed;bottom:clamp(12px,2vh,24px);right:clamp(16px,2vw,32px);display:flex;align-items:center;gap:10px;z-index:100}
.nbtn{width:clamp(44px,4.5vw,60px);height:clamp(44px,4.5vw,60px);border-radius:50%;background:rgba(15,32,64,.88);border:1.5px solid rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:clamp(18px,2vw,26px);display:flex;align-items:center;justify-content:center;transition:background .2s}
.nbtn:hover{background:var(--blue-mid)}
#ncnt{font-size:clamp(16px,1.6vw,22px);color:rgba(255,255,255,.88);background:rgba(15,32,64,.75);padding:6px 18px;border-radius:20px;font-family:monospace;font-weight:600}
#pbar{position:fixed;bottom:0;left:0;height:5px;background:var(--s1);transition:width .35s ease;z-index:100}
#fs-btn{position:fixed;top:10px;right:clamp(56px,6vw,80px);z-index:200;background:rgba(15,32,64,.7);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;font-size:16px;width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;transition:background .2s}
#fs-btn:hover{background:var(--blue-mid)}
#hint{position:fixed;bottom:clamp(12px,2vh,24px);left:clamp(16px,2vw,32px);font-size:13px;color:rgba(255,255,255,.5);background:rgba(15,32,64,.65);padding:5px 14px;border-radius:20px;font-family:monospace;transition:opacity .3s}
</style>
</head>
<body>
<div id="deck"></div>
<button id="fs-btn" title="Pantalla completa (F)">⛶</button>
<div id="nav"><button class="nbtn" id="bp">&#8592;</button><span id="ncnt">1 / 1</span><button class="nbtn" id="bn">&#8594;</button></div>
<div id="pbar"></div>
<div id="hint">Espacio / → avanzar · ← retroceder · F pantalla completa</div>
<script>
const SLIDES=[

/* ═══ 1. PORTADA ═══ */
{cls:'s-portada',noH:true,noF:true,clicks:0,html:`

/* ═══ 2. SESIÓN ═══ */

  </div>
  <div style="flex:1;padding:var(--pad-v) var(--pad-h);display:flex;flex-direction:column;gap:var(--gap);overflow-y:auto">

/* ═══ 3. DETONANTE ═══ */
{bread:'Semana 1 › Exploración (10 min)',time:'EXPLORACIÓN · 10 min',fL:'Exploración — Conflicto cognitivo',clicks:3,html:`
<div class="title-row"><div class="accent" style="background:var(--s1)"></div><div style="flex:1"><div class="mbadge" style="background:var(--s1)">🔍 Exploración</div><div class="slide-title">El maestro de obra del barrio Manrique</div><div class="slide-instr">Lee la situación y dibuja tu primer intento antes de continuar.</div></div></div>

let cur=0,clicks=0;const deck=document.getElementById('deck');
function buildSlide(i){const s=SLIDES[i],d=document.createElement('div');d.className='slide'+(s.cls?' '+s.cls:'');let h='';if(!s.noH)h+=`<div class="hdr"><span class="hdr-b">${s.bread||''}</span>${s.time?`<span class="hdr-t" style="background:var(--s1)">${s.time}</span>`:''}</div>`;h+=`<div class="body">${s.html}</div>`;if(!s.noF)h+=`<div class="ftr"><span>${s.fL||''}</span><span>I.E. Merceditas Gómez Martínez · Geometría 7°</span></div>`;d.innerHTML=h;return d;}
function show(i,dir){const p=deck.querySelector('.slide.active');if(p)p.classList.remove('active','enter-r','enter-l');const el=buildSlide(i);deck.appendChild(el);const all=deck.querySelectorAll('.slide');if(all.length>2)all[0].remove();requestAnimationFrame(()=>{el.classList.add('active');el.classList.add(dir>=0?'enter-r':'enter-l');setTimeout(()=>el.classList.remove('enter-r','enter-l'),380);if(SLIDES[i].onEnter)SLIDES[i].onEnter();});clicks=0;document.getElementById('ncnt').textContent=`${i+1} / ${SLIDES.length}`;document.getElementById('pbar').style.width=(((i+1)/SLIDES.length)*100)+'%';}
function advance(){const s=SLIDES[cur];if(clicks<(s.clicks||0)){clicks++;if(s.onReveal)s.onReveal(clicks);return;}if(cur<SLIDES.length-1){cur++;show(cur,1);}}
function retreat(){if(cur>0){cur--;show(cur,-1);}}
document.getElementById('fs-btn').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});});
document.addEventListener('fullscreenchange',()=>{document.getElementById('fs-btn').textContent=document.fullscreenElement?'✕':'⛶';});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();advance();}if(e.code==='ArrowLeft'){e.preventDefault();retreat();}if(e.code==='KeyF')document.getElementById('fs-btn').click();});
document.getElementById('bn').addEventListener('click',advance);
document.getElementById('bp').addEventListener('click',retreat);
let tx=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?advance():retreat();}});
setTimeout(()=>{document.getElementById('hint').style.opacity='0';},5000);
show(0,1);
</script>
